name: WASM spectrogram probe
on:
  push:
    branches: [wasm-spectrogram]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Emscripten SDK
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          python3 "$RUNNER_TEMP/emsdk/emsdk.py" install 6.0.12
          python3 "$RUNNER_TEMP/emsdk/emsdk.py" activate 6.0.12
      - name: Build and test real WASM
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          python3 wasm/build.py
          node wasm/test.cjs
